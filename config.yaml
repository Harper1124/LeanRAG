  temperature: 0.0
  max_tokens: 256

mysql:
  host: "127.0.0.1"
  port: 4321
  user: "root"
  password: "B507b507@"
  charset: "utf8mb4"

# Model Parameters
model_params:
  openai_embedding_dim: 1536
  glm_embedding_dim: 1024
  max_token_size: 8192

multimodal:
  enabled: true
  parser: mineru
  mineru_backend: pipeline

  max_token_size: 1024
  overlap_token_size: 128

  use_media_caption: true
  use_table_summary: true
  use_media_vector_store: true

  media_attach_topk: 3
  evidence_topk: 5
  max_images_per_query: 4
  max_tables_per_query: 4

  answer_with_vlm_when_media: true
  vlm_model: qwen2.5vl:7b
  # vlm_model: qwen3-vl:8b
  vlm_base_url: "http://127.0.0.1:11444/v1"
  vlm_api_key: "ollama"

  chart_ocr:
    backend: pytesseract
    language: eng
    psm: 11
    upscale: 2.0
    min_confidence: 25
    y_axis_crop_fraction: 0.22

  embedding_dim: 1024
  graph_max_workers: 2
  graph_embedding_max_workers: 1

  retrieval:
    mode: "mm_hybrid"
    topk_text: 8
    topk_entity: 12
    topk_media: 8
    topk_page: 4
    always_run_all_retrievers: true

  fusion:
    mode: "rule_based"
    multi_hit_bonus: 0.10
    page_hint_bonus: 0.20
    modality_bonus: 0.15
    hop_decay:
      hop_1: 0.85
      hop_2: 0.70

  graph_expansion:
    enabled: true
    edge_file: "mm_edges.jsonl"
    edge_seed_file: "mm_edges_seed.jsonl"
    max_graph_hops: 1
    max_neighbors_per_edge_type:
      text_caption_of_media: 2
      text_refers_to_media: 3
      entity_link_media: 4
      media_near_text: 3
      page_contains_node: 8
      media_same_page_media: 2
      page_next_page: 1
      page_prev_page: 1

  context_aggregation:
    enabled: true
    mode: "media_projection_lca"
    max_media_projection_entities: 4
    max_text_projection_entities: 4
    max_lca_input_entities: 8
    max_page_context_nodes: 4
    max_aggregation_context_chars: 6000
    allow_single_letter_entities_for_projection: false
    filter_stopword_entities: true
    page_context:
      use_neighbor_pages: false
      allow_hop2_pages_as_background: true
      max_neighbor_page_context_nodes: 2
    lca:
      method: "query_graph_describe_reuse"
      fallback_to_page_context: true

  evidence_budget:
    max_text_nodes: 5
    max_entity_nodes: 8
    max_media_nodes: 4
    max_table_nodes: 3
    max_page_nodes: 3
    max_vlm_images: 3

  generation:
    use_vlm: true
    answer_with_vlm_when_media: true
    use_table_reasoner: true
    use_answer_format_oracle_abstention: true
    answer_not_enough_evidence: "Not answerable"
    max_prompt_chars: 24000
