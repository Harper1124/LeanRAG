# Model Parameters
model_params:
  openai_embedding_dim: 1536
  glm_embedding_dim: 1024
  max_token_size: 8192

multimodal:
  enabled: true
  parser: mineru
  mineru_backend: pipeline

  max_token_size: 1024
  overlap_token_size: 128

  use_media_caption: true
  use_table_summary: true
  use_media_vector_store: true

  media_attach_topk: 3
  evidence_topk: 5
  max_images_per_query: 4
  max_tables_per_query: 4

  answer_with_vlm_when_media: true
  vlm_model: qwen2.5vl:7b
  vlm_base_url: "http://127.0.0.1:11434/v1"
  vlm_api_key: "ollama"

  embedding_dim: 1024
  graph_max_workers: 2
  graph_embedding_max_workers: 1

  retrieval:
    mode: "mm_hybrid"
    topk_text: 8
    topk_entity: 12
    topk_media: 8
    topk_page: 4
    always_run_all_retrievers: true

  fusion:
    mode: "rule_based"
    multi_hit_bonus: 0.10
    page_hint_bonus: 0.20
    modality_bonus: 0.15

  evidence_budget:
    max_text_nodes: 6
    max_entity_nodes: 12
    max_media_nodes: 6
    max_table_nodes: 4
    max_page_nodes: 4
    max_vlm_images: 4

  generation:
    use_vlm: true
    answer_with_vlm_when_media: true
    use_table_reasoner: true
    answer_not_enough_evidence: "Not answerable"
    max_prompt_chars: 24000
